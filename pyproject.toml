[project]
name = "personal-hub"
version = "0.1.0"
description = "Личный хаб: Telegram-бот для задач и утреннего брифа"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3,<4",
    "aiosqlite>=0.20",
    "anthropic>=1.15.0",
    "apscheduler>=3.10,<4",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "recurring-ical-events==3.8.2",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "S", "PT", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
files = ["hub"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
