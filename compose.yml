services:
  hub:
    build: .
    image: personal-hub:latest
    restart: unless-stopped
    mem_limit: 384m
    stop_grace_period: 20s
    env_file: .env
    # Веб только внутри docker-сети: порт на хост не публикуется,
    # иначе X-Forwarded-* можно подделать в обход nginx.
    expose:
      - "8080"
    networks:
      default: {}
      proxy:
        aliases:
          - personal-hub
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true
