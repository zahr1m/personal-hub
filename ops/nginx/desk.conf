# desk.example.com, этап 2: после выпуска сертификата заменяет desk-http-only.conf.
# Копировать в conf.d/ вашего nginx (например, <NGINX_CONF_DIR>/desk.conf), затем nginx -t && nginx -s reload.
server {
    listen 80;
    server_name desk.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name desk.example.com;

    ssl_certificate     /etc/letsencrypt/live/desk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desk.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Только из VPN-сетей: подставьте свои подсети (<VPN_SUBNET>), по строке allow на каждую
    allow 10.0.0.0/24;
    deny all;

    client_max_body_size 1m;

    # docker DNS; адрес апстрима через переменную — nginx не кэширует IP навсегда
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $up_desk http://personal-hub:8080;
        proxy_pass $up_desk;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
