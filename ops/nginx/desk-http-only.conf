# desk.example.com, этап 1: только порт 80 (до выпуска сертификата).
# Копировать в conf.d/ вашего nginx (например, <NGINX_CONF_DIR>/desk.conf), затем nginx -t && nginx -s reload.
server {
    listen 80;
    server_name desk.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
